<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Times de Futebol</title>
</head>

<body>
    <header>
        <h1>Times de futebol</h1>
    </header>
    <main>
        <section>
            <form action="http://localhost:3000/times" method="post">
                <input type="text" name="nome" placeholder="Nome do Clube" required>
                <input type="number" name="vitorias" placeholder="Total de vitórias" required>
                <input type="number" name="empates" placeholder="Total de empates" required>
                <input type="number" name="derrotas" placeholder="Total de reddotas" required>
                <button type="reset">Limpar</button>
                <button type="submit">Enviar</button>
            </form>
        </section>
        <section>
            <table>
                <thead>
                    <tr>
                        <th>Clube</th>
                        <th>Pontos</th>
                        <th>Jogos</th>
                        <th>Vitorias</th>
                        <th>Empates</th>
                        <th>Derrotas</th>
                        <th>Ação</th>
                    </tr>
                </thead>
                <tbody id="dados">
                    <script>
                        fetch('http://localhost:3000/times')
                            .then(resp => resp.json())
                            .then(resp => {
                                resp.forEach(time => {
                                    dados.innerHTML += `<tr>
                                        <td contenteditable="true" id="nome${time.id}">${time.nome}</td>
                                        <td>${time.pontos}</td>
                                        <td>${time.jogos}</td>
                                        <td contenteditable="true" id="vitorias${time.id}">${time.vitorias}</td>
                                        <td contenteditable="true" id="empates${time.id}">${time.empates}</td>
                                        <td contenteditable="true" id="derrotas${time.id}">${time.derrotas}</td>
                                        <td>
                                            <button onclick="alterar(${time.id})">✏️</button>
                                            <button onclick="excluir(${time.id})">🧽</button>
                                        </td>
                                    </tr>`
                                });
                            })
                    </script>
                </tbody>
            </table>
        </section>
    </main>
    <footer>
        <h2>By wellifabio</h2>
    </footer>
</body>
<script>
    function alterar(id) {
        //Obter os dados da linha editável da tabela e converter
        const nome = document.getElementById(`nome${id}`).innerHTML
        const vitorias = Number(document.getElementById(`vitorias${id}`).innerHTML)
        const empates = Number(document.getElementById(`empates${id}`).innerHTML)
        const derrotas = Number(document.getElementById(`derrotas${id}`).innerHTML)
        //Transformar os dados em objeto JS
        const dados = {
            nome, vitorias, empates, derrotas
        }
        //Enviar efetivamente para alteração
        fetch(`http://localhost:3000/times/${id}`, {
            method: "put",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(dados)
        })
            .then(resp => { if (resp.status == 202) window.location.reload() })
    }
    function excluir(id) {
        if (confirm(`Confirma a exclusão do clube id = ${id}`)) {
            fetch(`http://localhost:3000/times/${id}`, { method: "delete" })
                .then(resp => { if (resp.status == 200) window.location.reload() })
        }
    }
</script>

</html>
