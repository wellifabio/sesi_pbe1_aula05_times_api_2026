<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Times de Futebol</title>
</head>

<body>
    <header>
        <h1>Times de futebol</h1>
    </header>

    <main>
        <section>
            <form action="http://localhost:3000/times" method="post">
                <input type="text" name="nome" placeholder="Nome do Clube" required>
                <input type="number" name="vitorias" placeholder="Total de vitórias" required>
                <input type="number" name="empates" placeholder="Total de empates" required>
                <input type="number" name="derrotas" placeholder="Total de derrotas" required>
                <button type="reset">Limpar</button>
                <button type="submit">Enviar</button>
            </form>
        </section>

        <section>
            <table>
                <thead>
                    <tr>
                        <th>Clube</th>
                        <th>Pontos</th>
                        <th>Jogos</th>
                        <th>Vitórias</th>
                        <th>Empates</th>
                        <th>Derrotas</th>
                        <th>Ação</th>
                    </tr>
                </thead>
                <tbody id="dados"></tbody>
            </table>
        </section>
    </main>

    <footer>
        <h2>By wellifabio</h2>
    </footer>

    <script>
        const dados = document.getElementById("dados");

        async function carregarTimes() {
            try {
                const resposta = await fetch("http://localhost:3000/times");
                const times = await resposta.json();

                dados.innerHTML = times.map(time => `
                    <tr>
                        <td contenteditable="true" id="nome${time.id}">${time.nome}</td>
                        <td>${time.pontos}</td>
                        <td>${time.jogos}</td>
                        <td contenteditable="true" id="vitorias${time.id}">${time.vitorias}</td>
                        <td contenteditable="true" id="empates${time.id}">${time.empates}</td>
                        <td contenteditable="true" id="derrotas${time.id}">${time.derrotas}</td>
                        <td>
                            <button type="button" onclick="alterar(${time.id})">✏️</button>
                            <button type="button" onclick="excluir(${time.id})">🧽</button>
                        </td>
                    </tr>
                `).join("");
            } catch (erro) {
                console.error("Erro ao carregar os times:", erro);
            }
        }

        function alterar(id) {
            const nome = document.getElementById(`nome${id}`).innerText.trim();
            const vitorias = Number(document.getElementById(`vitorias${id}`).innerText.trim());
            const empates = Number(document.getElementById(`empates${id}`).innerText.trim());
            const derrotas = Number(document.getElementById(`derrotas${id}`).innerText.trim());

            const dadosAtualizados = {
                nome,
                vitorias,
                empates,
                derrotas
            };

            fetch(`http://localhost:3000/times/${id}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(dadosAtualizados)
            })
                .then(resp => {
                    if (resp.status === 202) {
                        window.location.reload();
                    }
                });
        }

        function excluir(id) {
            if (confirm(`Confirma a exclusão do clube id = ${id}`)) {
                fetch(`http://localhost:3000/times/${id}`, { method: "DELETE" })
                    .then(resp => {
                        if (resp.status === 200) {
                            window.location.reload();
                        }
                    });
            }
        }

        carregarTimes();
    </script>
</body>

</html>
